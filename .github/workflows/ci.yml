name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  quality:
    name: fmt / check / clippy / tests / compatibility / audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: php2shell-rs-ci

      - name: 1. rustfmt
        run: cargo fmt --all -- --check

      - name: 2. cargo check
        run: cargo check --workspace --all-targets --locked

      - name: 3. clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 4. unit tests
        run: cargo test --workspace --lib --bins --locked

      - name: 5. integration tests
        run: cargo test --workspace --test integration --locked

      - name: 6. JSON compatibility tests
        run: cargo test --workspace --test compatibility --locked

      - name: 7. original profile validation
        run: cargo run --quiet --locked -- profile validate

      - name: 8. dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
