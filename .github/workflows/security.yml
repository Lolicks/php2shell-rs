name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: cargo audit and dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: php2shell-rs-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit
      - name: Duplicate dependency report
        run: cargo tree --workspace -d || true

  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    name: license inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency licenses
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --locked > metadata.json
          jq -r '.packages[].license // "UNKNOWN"' metadata.json \
            | sort | uniq -c | sort -rn
          # Flag copyleft-only licenses. Dual-licensed crates (for example
          # "MIT OR Apache-2.0 OR LGPL-2.1-or-later") let downstream users pick
          # a permissive option and are therefore acceptable.
          if jq -e '
            [.packages[]
             | {license: (.license // "")}
             | select(.license | test("GPL|AGPL|SSPL"; "i"))
             | select(.license | (test("MIT|Apache|ISC|BSD|Unlicense|Zlib|0BSD"; "i") | not))]
            | length > 0
          ' metadata.json > /dev/null; then
            echo "::error::copyleft-only license detected in dependency graph"
            exit 1
          fi

  workflow-permissions:
    name: workflow permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every workflow declares minimal permissions
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml; do
            if ! grep -q '^permissions:' "$file"; then
              echo "::error::$file has no explicit permissions block"
              exit 1
            fi
          done
          echo "all workflows declare permissions explicitly"
