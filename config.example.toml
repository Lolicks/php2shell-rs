# PHP2Shell-RS example configuration.
# Safe mode is the default: loopback targets only, TLS verification enabled,
# strict profile validation and redacted reports.

mode = "safe"
allowed_addresses = []

[http]
timeout_secs = 10
connect_timeout_secs = 5
max_response_bytes = 2097152
max_redirects = 3
pool_max_idle_per_host = 4
tls_verify = true
user_agent = "php2shell-rs/1.0.0"

[profiles]
directory = "profiles"
manifest = "profiles/manifest.json"
strict = true

[lab]
docker_command = "docker"
compose_files = ["lab/wordpress/docker-compose.yml"]
runtime_dir = "lab"
timeout_secs = 60

[report]
format = "json"
output_dir = "reports"
redact = true

[log]
verbosity = 1
quiet = false
json = false
color = "auto"

# Explicitly authorised non-loopback hosts/CIDRs are declared at the top of
# this file (`allowed_addresses`). Leave empty unless the target is yours or
# you have written permission. Nothing is discovered.
