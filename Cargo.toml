[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["PHP2Shell-RS contributors"]
repository = "https://github.com/devploit/php2shell"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "process", "io-util"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "charset", "gzip", "stream"] }
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive", "color", "suggestions"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "all-widgets"] }
crossterm = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
flate2 = "1.1.11"
tar = "0.4.46"
sha2 = "0.10.9"
tempfile = "3.27.0"
axum = "0.8.9"
futures = "0.3.34"
indicatif = "0.18.6"

php2shell-core = { path = "crates/core" }
php2shell-config = { path = "crates/config" }
php2shell-profiles = { path = "crates/profiles" }
php2shell-http-client = { path = "crates/http-client" }
php2shell-fingerprint = { path = "crates/fingerprint" }
php2shell-binary-parser = { path = "crates/binary-parser" }
php2shell-diagnostics = { path = "crates/diagnostics" }
php2shell-calibration = { path = "crates/calibration" }
php2shell-inventory = { path = "crates/inventory" }
php2shell-lab-manager = { path = "crates/lab-manager" }
php2shell-reporting = { path = "crates/reporting" }
php2shell-cli = { path = "crates/cli" }
php2shell-tui = { path = "crates/tui" }

[package]
name = "php2shell-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standalone Rust diagnostic and laboratory toolkit for PHP build profiles (no Python runtime, no exploitation features)"

[dependencies]
anyhow.workspace = true
php2shell-cli.workspace = true

[dev-dependencies]
php2shell-core.workspace = true
php2shell-config.workspace = true
php2shell-profiles.workspace = true
php2shell-http-client.workspace = true
php2shell-fingerprint.workspace = true
php2shell-lab-manager.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "compatibility"
path = "tests/compatibility/mod.rs"
